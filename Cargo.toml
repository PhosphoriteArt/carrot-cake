[package]
name = "carrot_cake"
version = "0.1.0"
edition = "2024"

[features]
default = ["dev"]
dev = []

[dependencies]
async-trait = "0.1.92"
log = { version = "0.4.34" }
tokio = { version = "1.53.1", features = [
  "tokio-macros",
  "sync",
  "rt-multi-thread",
  "signal",
] }
twitch_api = { version = "0.8.0", features = [
  "client",
  "default",
  "eventsub",
  "helix",
  "pubsub",
  "reqwest",
] }
dotenv = "0.15.0"
reqwest = "0.13.5"
anyhow = "1.0.104"
uuid = { version = "1.26.1", features = ["v4"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls-vendored"] }
futures-sink = "0.3.34"
futures-core = "0.3.34"
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = "0.32.0"
reqwest-tracing = { version = "0.7.1", features = ["opentelemetry_0_32"] }
reqwest-middleware = "0.5.2"
http = "1.5.0"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-log = "0.2.0"
ansi_term = "0.12.1"
opentelemetry-appender-tracing = { version = "0.32.0", features = ["log"] }
lazy_static = "1.5.0"
scopeguard = "1.2.0"
yaml-rust = "0.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serenity = "0.12.5"
