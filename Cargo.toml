[package]
name = "carrot_cake"
version = "0.1.6"
edition = "2024"

[features]
default = ["dev"]
dev = []

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

[dependencies]
log = { version = "0.4.34" }
tokio = { version = "1.53.1", features = [
  "tokio-macros",
  "sync",
  "rt-multi-thread",
  "signal",
] }
twitch_api = { version = "0.8.0", features = [
  "client",
  "eventsub",
  "helix",
  "reqwest",
] }
dotenv = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-vendored", "http2"] }
anyhow = "1.0.104"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls-vendored"] }
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = "0.32.0"
reqwest-tracing = { version = "0.7.1", features = ["opentelemetry_0_32"] }
reqwest-middleware = "0.5.2"
http = "1.5.0"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
opentelemetry-appender-tracing = { version = "0.32.0", features = ["log"] }
lazy_static = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serenity = { version = "0.12.5", default-features = false, features = [
  "builder", "chrono", "client", "gateway", "model", "http", "native_tls_backend",
] }
chrono = { version = "0.4.45", features = ["serde"] }
humantime = "2.4.0"
dashmap = "6.2.1"
url-builder = "0.1.1"
urlencoding = "2.1.3"
